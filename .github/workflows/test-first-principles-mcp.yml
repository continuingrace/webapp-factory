name: Test First-Principles Design MCP

on:
  push:
    branches: [main]
    paths:
      - 'mcp/first-principles-design/**'
      - '.github/workflows/test-first-principles-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/first-principles-design
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Smoke test server startup
        shell: bash
        run: |
          set -euo pipefail
          node dist/index.js >/tmp/mcp.out 2>/tmp/mcp.err &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            echo 'MCP server exited unexpectedly'
            cat /tmp/mcp.err || true
            exit 1
          fi
          kill "$pid" || true
